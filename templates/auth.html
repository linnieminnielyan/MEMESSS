<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-white border-0 text-center pt-4">
                        <h2>Meme Generator</h2>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for msg in messages %}
                                    <div class="alert alert-info">{{ msg }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <ul class="nav nav-tabs mb-4">
                            <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#login">Вход</a></li>
                            <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#register">Регистрация</a></li>
                        </ul>

                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="login">
                                <form action="/login" method="POST">
                                    <input type="text" name="username" class="form-control mb-2" placeholder="Имя" required>
                                    <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required>
                                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="register">
                                <form action="/register" method="POST">
                                    <input type="text" name="username" class="form-control mb-2" placeholder="Имя" required>
                                    <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required>
                                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
